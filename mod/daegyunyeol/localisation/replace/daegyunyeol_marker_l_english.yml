l_english:

 # 로딩 확인용 마커.
 #
 # localisation/replace/ 는 바닐라 로컬라이제이션을 덮어쓴다.
 # 이 파일이 먹히면 국가 선택 화면의 일본 이름이 바뀐다.
 #
 #   "Japan [DAEGYUNYEOL OK]"  -> 모드가 로드되고 있다
 #   "Japan"                   -> 모드가 전혀 로드되지 않았다
 #
 # 일부러 ASCII 로만 썼다. 한글 폰트가 없어도 무조건 보인다.
 # 즉 이 글자가 보이는데 포커스 이름이 네모로 나온다면 그건 폰트 문제이고,
 # 이 글자조차 안 보이면 설치/런처 문제다. 두 원인이 분리된다.
 #
 # 확인이 끝나면 이 파일만 지우면 된다.

 JAP:0 "Japan [DAEGYUNYEOL OK]"
 JAP_DEF:0 "Japan [DAEGYUNYEOL OK]"
