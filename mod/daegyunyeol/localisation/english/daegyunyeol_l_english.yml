l_english:

 # --- 디시전 ---
 daegyunyeol_category:0 "The Great Rift"
 JAP_activate_daegyunyeol:0 "Open the Great Rift"
 JAP_activate_daegyunyeol_desc:0 "The Imperial Army's technical headquarters has determined that the rift above the Korean Peninsula is no natural phenomenon. We will force it open."

 # --- 포커스 ---
 KOR_daegyunyeol_awakening:0 "Awakening of the Great Rift"
 KOR_daegyunyeol_awakening_desc:0 "On the day the sky split apart, the Korean Peninsula ceased to be an imperial backwater."
 KOR_investigate_rift:0 "Investigate the Rift"
 KOR_investigate_rift_desc:0 "We will decipher the technology and signals flowing through the rift. The existence of three districts has been confirmed."

 KOR_nikke_contact:0 "Contact the Nikke District"
 KOR_nikke_contact_desc:0 "First contact has been established with those who lost the surface and retreated into the Ark."
 KOR_nikke_ark_foundries:0 "Ark Foundries"
 KOR_nikke_ark_foundries_desc:0 "We will relocate the Ark's self-sufficient foundries to the peninsula, bringing their metallurgy through the rift."
 KOR_nikke_heavy_industry:0 "Transfer Heavy Industry"
 KOR_nikke_heavy_industry_desc:0 "All the production capacity the Ark amassed to reclaim the surface will be incorporated into our planned economy."
 KOR_nikke_absorb:0 "Integrate the Nikke District"
 KOR_nikke_absorb_desc:0 "The Nikke District comes under the administration of the Republic of Korea."

 KOR_trickcal_contact:0 "Contact the Trickcal District"
 KOR_trickcal_contact_desc:0 "We have established communications with a second district discovered south of the rift."
 KOR_trickcal_light_industry:0 "Light Industrial Complex"
 KOR_trickcal_light_industry_desc:0 "We will bring the Trickcal District's workshops together in a single industrial complex. Their speed is even more remarkable than their output."
 KOR_trickcal_consumer_goods:0 "Reorganize Consumer Production"
 KOR_trickcal_consumer_goods_desc:0 "Local district production will meet our consumer needs, freeing factories for other work."
 KOR_trickcal_absorb:0 "Integrate the Trickcal District"
 KOR_trickcal_absorb_desc:0 "The Trickcal District has voluntarily chosen integration."

 KOR_ba_contact:0 "Contact the Blue Archive District"
 KOR_ba_contact_desc:0 "The third district is a vast federation of academy cities."
 KOR_ba_kivotos_labs:0 "Kivotos Research Complex"
 KOR_ba_kivotos_labs_desc:0 "In exchange for recognizing academy autonomy, we gain access to their research facilities."
 KOR_ba_automation:0 "Academy Automation"
 KOR_ba_automation_desc:0 "We will introduce Kivotos's automated production lines into our factories, transforming the pace at which they gain efficiency."
 KOR_ba_absorb:0 "Integrate the Blue Archive District"
 KOR_ba_absorb_desc:0 "Kivotos has become part of the Republic of Korea."

 KOR_nikke_arms_conversion:0 "Convert to Arms Production"
 KOR_nikke_arms_conversion_desc:0 "Half the Ark foundries will turn to weapons production. Full rearmament is still distant, but the arms ban begins to end here."
 KOR_trickcal_welfare:0 "Trickcal Welfare Plan"
 KOR_trickcal_welfare_desc:0 "We will establish settlement support for our new citizens. The population is growing rapidly."
 KOR_ba_academy:0 "Academy Research Network"
 KOR_ba_academy_desc:0 "We will incorporate the academies of Kivotos into the national research network."

 KOR_provisional_government:0 "Establish a Provisional Government"
 KOR_provisional_government_desc:0 "We will establish an interim administration to fill the vacuum left by the rift."
 KOR_rift_constitution:0 "A Constitution for the Rift"
 KOR_rift_constitution_desc:0 "By what principles shall we govern the three districts? A draft constitution has been submitted."
 KOR_path_democratic:0 "Open Districts"
 KOR_path_democratic_desc:0 "Each district will be guaranteed autonomy and elections. Integration will be slow, but durable."
 KOR_path_authoritarian:0 "Closed Districts"
 KOR_path_authoritarian_desc:0 "District autonomy will be suspended in favor of direct central rule. There will be resistance, but speed is on our side."
 KOR_district_assembly:0 "Three-District Assembly"
 KOR_district_assembly_desc:0 "Representatives of the three districts gather together. In form or in substance, this completes our state."

 KOR_three_districts_united:0 "Unite the Three Districts"
 KOR_three_districts_united_desc:0 "The three districts stand beneath one government. The world sees the peninsula anew."
 KOR_new_republic:0 "Republic of the Great Rift"
 KOR_new_republic_desc:0 "We will proclaim a new constitution suited to the order that emerged after the rift."
 KOR_rift_army:0 "Establish the Rift Army"
 KOR_rift_army_desc:0 "We will create a new military organization combining the combat doctrines of all three districts."
 KOR_rift_industry:0 "Rift Industrial Base"
 KOR_rift_industry_desc:0 "We will introduce each district's production technology into the peninsula's industrial regions."
 KOR_seal_the_rift:0 "Seal the Great Rift"
 KOR_seal_the_rift_desc:0 "We have gained everything we need. It is time to close the rift."

 # --- 이벤트 ---
 daegyunyeol.1.t:0 "The Great Rift Opens"
 daegyunyeol.1.d:0 "The rift above the Korean Peninsula has opened fully. Imperial lines of control collapsed overnight, and a new government has been proclaimed in Gyeongseong."
 daegyunyeol.1.a:0 "We cannot control it."

 daegyunyeol.2.t:0 "The Republic of Korea Is Founded"
 daegyunyeol.2.d:0 "A new state stands in the vacuum left by the rift. All remaining units on the peninsula have been disbanded. Their equipment and manpower were recovered, but this country has nothing that can be called an army.\n\nThree unknown districts lie before us. We will build the factories first."
 daegyunyeol.2.a:0 "Our era begins."

 daegyunyeol.3.t:0 "First Contact with the Nikke District"
 daegyunyeol.3.d:0 "A civilization that abandoned the surface and withdrew into the Ark has answered. They seek to reclaim the surface."
 daegyunyeol.3.a:0 "There is room for cooperation."

 daegyunyeol.4.t:0 "The Nikke District Is Integrated"
 daegyunyeol.4.d:0 "Command of the Ark has passed to us. Their combat doctrine will transform our military."
 daegyunyeol.4.a:0 "Excellent."

 daegyunyeol.5.t:0 "First Contact with the Trickcal District"
 daegyunyeol.5.d:0 "Contrary to our expectations, the second district was not hostile. They seemed almost to have been waiting for us."
 daegyunyeol.5.a:0 "Begin the talks."

 daegyunyeol.6.t:0 "The Trickcal District Is Integrated"
 daegyunyeol.6.d:0 "The agreement was concluded smoothly. They are adapting to our system with remarkable speed."
 daegyunyeol.6.a:0 "Welcome."

 daegyunyeol.7.t:0 "First Contact with the Blue Archive District"
 daegyunyeol.7.d:0 "What we found in the third district was not a state, but a vast federation of autonomous academy cities."
 daegyunyeol.7.a:0 "Intriguing."

 daegyunyeol.8.t:0 "The Blue Archive District Is Integrated"
 daegyunyeol.8.d:0 "Kivotos's industry and research infrastructure are now in our hands. Autonomy is a small price to pay."
 daegyunyeol.8.a:0 "The agreement stands."

 daegyunyeol.9.t:0 "The Three Districts Declare Unity"
 daegyunyeol.9.d:0 "The Republic of Korea has announced the integration of all three districts beyond the rift. The balance of power in the Far East has been rewritten."
 daegyunyeol.9.a:0 "We have done it."
 daegyunyeol.9.b:0 "This is a threat."

 daegyunyeol.10.t:0 "The Provisional Government"
 daegyunyeol.10.d:0 "An interim administrative committee has replaced the fallen colonial government. First, we must decide in what capacity we will deal with the districts beyond the rift."
 daegyunyeol.10.a:0 "We are a state."
 daegyunyeol.10.b:0 "Order comes first."

 daegyunyeol.11.t:0 "A Draft Constitution for the Rift"
 daegyunyeol.11.d:0 "The constitutional draft presents two paths: recognize each district's autonomy, or place them under direct central rule."
 daegyunyeol.11.a:0 "It is time to choose."

 daegyunyeol.12.t:0 "The Three-District Assembly Opens"
 daegyunyeol.12.d:0 "Delegations from all three districts have gathered in Gyeongseong. For the first time since the rift, every power here sits at the same table."
 daegyunyeol.12.a:0 "The assembly is ours."
 daegyunyeol.12.b:0 "The formalities are in place."

 daegyunyeol.13.t:0 "The Great Rift Closes"
 daegyunyeol.13.d:0 "The rift above the Korean Peninsula has been sealed completely. Those who crossed remain, but the passage is gone. The world no longer knows how to deal with this country."
 daegyunyeol.13.a:0 "We go forward by our own strength."
 daegyunyeol.13.b:0 "What have they gained?"

 daegyunyeol.14.t:0 "The Foundries Turn to Arms"
 daegyunyeol.14.d:0 "Half the Ark foundries have been converted to weapons production. For the first time since the rift, this country is producing firearms."
 daegyunyeol.14.a:0 "Now we can defend ourselves."

 daegyunyeol.15.t:0 "The Rift Army Is Established"
 daegyunyeol.15.d:0 "The arms ban has been lifted completely. Work has begun to unite the manpower and facilities of all three districts into one army."
 daegyunyeol.15.a:0 "Now we have an army."

 # --- 국가 이념 ---
 KOR_nikke_district:0 "Nikke District"
 KOR_nikke_district_desc:0 "The Ark's combat doctrine has been integrated into our military."
 KOR_trickcal_district:0 "Trickcal District"
 KOR_trickcal_district_desc:0 "Our new citizens are adapting to the system with remarkable speed."
 KOR_ba_district:0 "Blue Archive District"
 KOR_ba_district_desc:0 "We draw upon Kivotos's research capacity and production facilities."
 KOR_rift_republic:0 "Republic of the Great Rift"
 KOR_rift_republic_desc:0 "A new constitutional order encompassing all three districts."

 KOR_rift_demilitarization:0 "Arms Ban"
 KOR_rift_demilitarization_desc:0 "The rift left us factories, not an army. We lack both recruits and facilities for producing weapons. Until the Nikke District's foundries turn to arms production, this country cannot build an army."
 KOR_limited_rearmament:0 "Limited Rearmament"
 KOR_limited_rearmament_desc:0 "Weapons production has resumed. Our scale and manpower remain limited, but at least we now have something that can be called an army."
 KOR_trickcal_consumer_economy:0 "Consumer Economy"
 KOR_trickcal_consumer_economy_desc:0 "The districts' own production meets a substantial share of our consumer needs."
 KOR_ba_automation_idea:0 "Academy Automation"
 KOR_ba_automation_idea_desc:0 "Automated production lines allow our factories to recover efficiency quickly."
 KOR_trickcal_welfare_idea:0 "Trickcal Welfare Plan"
 KOR_trickcal_welfare_idea_desc:0 "Settlement support is taking hold, and the population is growing rapidly."
 KOR_ba_academy_idea:0 "Academy Research Network"
 KOR_ba_academy_idea_desc:0 "The academies of Kivotos participate in the national research program."
 KOR_open_districts:0 "Open Districts"
 KOR_open_districts_desc:0 "Each district participates in the federation while retaining its autonomy."
 KOR_sealed_districts:0 "Closed Districts"
 KOR_sealed_districts_desc:0 "District autonomy has been suspended. All decisions now come from the center."

 # --- 어드바이저 / 지도자 ---
 KOR_rift_commissar:0 "Rift Commissioner"
 KOR_district_liaison:0 "District Liaison"
 KOR_rift_industrialist:0 "Rift Industrialist"
 KOR_leader_democratic:0 "President of the Three-District Federation"
 KOR_leader_authoritarian:0 "Chair of the Rift Control Committee"
 KOR_rift_research:0 "Rift Research"
 KOR_nikke_foundry_bonus:0 "Ark Foundry Technology"
 KOR_nikke_heavy_bonus:0 "Nikke Heavy Industry Technology"
 KOR_kivotos_research:0 "Kivotos Research"
 KOR_rift_army_bonus:0 "Rift Army Doctrine"
 KOR_rift_industry_bonus:0 "Rift Industrial Technology"
