l_english:

 # --- 디시전 ---
 daegyunyeol_category:0 "대균열"
 JAP_activate_daegyunyeol:0 "대균열 발동"
 JAP_activate_daegyunyeol_desc:0 "제국 육군 기술본부가 한반도 상공에서 관측한 균열은 자연 현상이 아니다. 균열을 강제로 개방한다."

 # --- 포커스 ---
 KOR_daegyunyeol_awakening:0 "대균열의 각성"
 KOR_daegyunyeol_awakening_desc:0 "하늘이 갈라진 날, 한반도는 더 이상 제국의 변방이 아니었다."
 KOR_investigate_rift:0 "균열 조사"
 KOR_investigate_rift_desc:0 "균열 너머에서 흘러나온 기술과 신호를 해석한다. 세 개의 지구가 존재한다는 사실이 확인되었다."

 KOR_nikke_contact:0 "니케 지구 접촉"
 KOR_nikke_contact_desc:0 "지상을 빼앗기고 방주로 물러난 이들과 첫 통신이 성립했다."
 KOR_nikke_ark_foundries:0 "방주 주조창"
 KOR_nikke_ark_foundries_desc:0 "방주의 자립형 주조 설비를 한반도에 이설한다. 균열 너머의 야금 기술이 그대로 넘어온다."
 KOR_nikke_heavy_industry:0 "중공업 이관"
 KOR_nikke_heavy_industry_desc:0 "방주가 지상 탈환을 위해 쌓아둔 생산 능력 전부가 우리 계획경제에 편입된다."
 KOR_nikke_absorb:0 "니케 지구 흡수"
 KOR_nikke_absorb_desc:0 "니케 지구가 대한민국의 행정권 아래 들어온다."

 KOR_trickcal_contact:0 "트릭컬 지구 접촉"
 KOR_trickcal_contact_desc:0 "균열 남쪽에서 확인된 두 번째 지구와의 교신에 성공했다."
 KOR_trickcal_light_industry:0 "경공업 단지"
 KOR_trickcal_light_industry_desc:0 "트릭컬 지구의 공방들을 하나의 산업 단지로 묶는다. 생산량보다 놀라운 건 속도다."
 KOR_trickcal_consumer_goods:0 "소비재 개편"
 KOR_trickcal_consumer_goods_desc:0 "필요 소비재를 지구 자체 생산으로 대체한다. 남는 공장이 다른 곳으로 돌아간다."
 KOR_trickcal_absorb:0 "트릭컬 지구 흡수"
 KOR_trickcal_absorb_desc:0 "트릭컬 지구가 자발적으로 편입을 선택했다."

 KOR_ba_contact:0 "블루아카이브 지구 접촉"
 KOR_ba_contact_desc:0 "세 번째 지구는 거대한 학원도시 연합체였다."
 KOR_ba_kivotos_labs:0 "키보토스 연구단지"
 KOR_ba_kivotos_labs_desc:0 "학원 자치권을 인정하는 대신 연구 설비를 공유받는다."
 KOR_ba_automation:0 "학원 자동화"
 KOR_ba_automation_desc:0 "키보토스의 자동 생산 라인을 우리 공장에 이식한다. 숙련도가 붙는 속도가 달라진다."
 KOR_ba_absorb:0 "블루아카이브 지구 흡수"
 KOR_ba_absorb_desc:0 "키보토스가 대한민국의 일부가 되었다."

 KOR_nikke_arms_conversion:0 "군수 전환"
 KOR_nikke_arms_conversion_desc:0 "방주 주조창의 절반을 병기 생산으로 돌린다. 완전한 무장은 아니지만, 무장 금지는 여기서 깨진다."
 KOR_trickcal_welfare:0 "트릭컬 복지 계획"
 KOR_trickcal_welfare_desc:0 "새 시민들을 위한 정착 지원 체계를 세운다. 인구가 빠르게 늘고 있다."
 KOR_ba_academy:0 "학원 연구망"
 KOR_ba_academy_desc:0 "키보토스의 학원들을 국가 연구망에 편입한다."

 KOR_provisional_government:0 "임시정부 수립"
 KOR_provisional_government_desc:0 "균열 직후의 공백을 메울 임시 행정기구를 세운다."
 KOR_rift_constitution:0 "균열 헌정"
 KOR_rift_constitution_desc:0 "세 지구를 어떤 원칙으로 통치할 것인가. 헌법 초안이 올라왔다."
 KOR_path_democratic:0 "열린 지구"
 KOR_path_democratic_desc:0 "각 지구에 자치권과 선거를 보장한다. 통합은 느리지만 무너지지 않는다."
 KOR_path_authoritarian:0 "닫힌 지구"
 KOR_path_authoritarian_desc:0 "지구 자치를 정지하고 중앙이 직접 관할한다. 반발은 있겠지만 속도는 우리 편이다."
 KOR_district_assembly:0 "삼지구 의회"
 KOR_district_assembly_desc:0 "세 지구의 대표가 한자리에 모인다. 형식이든 실질이든, 이것으로 국가는 완성된다."

 KOR_three_districts_united:0 "삼지구 통합"
 KOR_three_districts_united_desc:0 "세 지구가 하나의 국가 아래 모였다. 세계는 이제 한반도를 다시 본다."
 KOR_new_republic:0 "대균열 공화국"
 KOR_new_republic_desc:0 "균열 이후의 질서에 맞춘 새로운 헌법을 선포한다."
 KOR_rift_army:0 "균열군 창설"
 KOR_rift_army_desc:0 "세 지구의 전투 교리를 통합한 신편제를 구성한다."
 KOR_rift_industry:0 "균열 산업기반"
 KOR_rift_industry_desc:0 "지구별 생산 기술을 한반도 공업지대에 이식한다."
 KOR_seal_the_rift:0 "대균열 봉인"
 KOR_seal_the_rift_desc:0 "얻을 것은 모두 얻었다. 이제 균열을 닫는다."

 # --- 이벤트 ---
 daegyunyeol.1.t:0 "대균열이 열리다"
 daegyunyeol.1.d:0 "한반도 상공의 균열이 완전히 개방되었다. 제국의 통제선은 하룻밤 사이에 무너졌고, 경성에서는 새 정부의 수립이 선포되었다."
 daegyunyeol.1.a:0 "통제할 수 없다."

 daegyunyeol.2.t:0 "대한민국 수립"
 daegyunyeol.2.d:0 "균열이 남긴 공백 위에 새 국가가 섰다. 우리 앞에는 세 개의 미지의 지구가 있다."
 daegyunyeol.2.a:0 "우리의 시대가 시작된다."

 daegyunyeol.3.t:0 "니케 지구와의 첫 접촉"
 daegyunyeol.3.d:0 "지표면을 포기하고 방주에 틀어박힌 문명이 응답했다. 그들은 지상 탈환을 원한다."
 daegyunyeol.3.a:0 "협력할 여지가 있다."

 daegyunyeol.4.t:0 "니케 지구 흡수 완료"
 daegyunyeol.4.d:0 "방주의 지휘권이 우리에게 넘어왔다. 그들의 전투 교리는 우리 군을 바꿔놓을 것이다."
 daegyunyeol.4.a:0 "훌륭하다."

 daegyunyeol.5.t:0 "트릭컬 지구와의 첫 접촉"
 daegyunyeol.5.d:0 "두 번째 지구는 예상과 달리 적대적이지 않았다. 오히려 우리를 기다리고 있었던 것처럼 보인다."
 daegyunyeol.5.a:0 "대화를 시작한다."

 daegyunyeol.6.t:0 "트릭컬 지구 흡수 완료"
 daegyunyeol.6.d:0 "협약은 순조롭게 체결되었다. 그들은 우리 체제에 놀라울 만큼 빠르게 적응하고 있다."
 daegyunyeol.6.a:0 "환영한다."

 daegyunyeol.7.t:0 "블루아카이브 지구와의 첫 접촉"
 daegyunyeol.7.d:0 "세 번째 지구에서 확인된 것은 국가가 아니라 거대한 학원 자치도시들의 연합이었다."
 daegyunyeol.7.a:0 "흥미롭군."

 daegyunyeol.8.t:0 "블루아카이브 지구 흡수 완료"
 daegyunyeol.8.d:0 "키보토스의 산업과 연구 기반이 우리 손에 들어왔다. 자치권은 그 대가로 충분히 싸다."
 daegyunyeol.8.a:0 "계약은 성립했다."

 daegyunyeol.9.t:0 "삼지구 통합 선언"
 daegyunyeol.9.d:0 "대한민국이 균열 너머의 세 지구를 모두 통합했다고 선언했다. 극동의 세력 균형은 완전히 다시 쓰였다."
 daegyunyeol.9.a:0 "우리가 해냈다."
 daegyunyeol.9.b:0 "이건 위협이다."

 daegyunyeol.10.t:0 "임시정부"
 daegyunyeol.10.d:0 "총독부가 무너진 자리에 임시 행정위원회가 들어섰다. 균열 너머의 지구들을 어떤 자격으로 상대할 것인지부터 정해야 한다."
 daegyunyeol.10.a:0 "우리는 국가다."
 daegyunyeol.10.b:0 "우선 질서부터."

 daegyunyeol.11.t:0 "균열 헌정 초안"
 daegyunyeol.11.d:0 "헌법 초안은 두 갈래로 갈렸다. 지구별 자치를 인정할 것인가, 중앙이 직접 통할할 것인가."
 daegyunyeol.11.a:0 "선택의 시간이다."

 daegyunyeol.12.t:0 "삼지구 의회 개회"
 daegyunyeol.12.d:0 "세 지구의 대표단이 경성에 모였다. 균열 이후 처음으로, 이곳의 모든 세력이 같은 탁자에 앉았다."
 daegyunyeol.12.a:0 "의회는 우리의 것이다."
 daegyunyeol.12.b:0 "형식은 갖췄다."

 daegyunyeol.13.t:0 "대균열, 닫히다"
 daegyunyeol.13.d:0 "한반도 상공의 균열이 완전히 봉인되었다. 넘어온 것들은 남았고, 길은 사라졌다. 세계는 이제 이 나라를 어떻게 다뤄야 할지 모른다."
 daegyunyeol.13.a:0 "이제 우리 힘으로 간다."
 daegyunyeol.13.b:0 "저들은 무엇을 얻었나."

 daegyunyeol.14.t:0 "주조창, 병기로 돌아서다"
 daegyunyeol.14.d:0 "방주 주조창의 절반이 병기 생산으로 전환되었다. 균열 이후 처음으로 이 나라에서 총이 나온다."
 daegyunyeol.14.a:0 "이제 지킬 수 있다."

 daegyunyeol.15.t:0 "균열군 창설"
 daegyunyeol.15.d:0 "무장 금지가 완전히 해제되었다. 세 지구의 인력과 설비를 하나의 군대로 묶는 작업이 시작된다."
 daegyunyeol.15.a:0 "이제 군대다."

 # --- 국가 이념 ---
 KOR_nikke_district:0 "니케 지구"
 KOR_nikke_district_desc:0 "방주의 전투 교리가 우리 군에 통합되었다."
 KOR_trickcal_district:0 "트릭컬 지구"
 KOR_trickcal_district_desc:0 "새 시민들이 놀라운 속도로 체제에 녹아들고 있다."
 KOR_ba_district:0 "블루아카이브 지구"
 KOR_ba_district_desc:0 "키보토스의 연구 역량과 생산 설비를 활용한다."
 KOR_rift_republic:0 "대균열 공화국"
 KOR_rift_republic_desc:0 "세 지구를 아우르는 새로운 헌정 질서."

 KOR_rift_demilitarization:0 "무장 금지"
 KOR_rift_demilitarization_desc:0 "균열이 남긴 것은 공장이지 군대가 아니다. 징집할 인력도, 병기를 뽑아낼 설비도 없다. 니케 지구의 주조창을 군수로 돌리기 전까지 이 나라는 군대를 만들 수 없다."
 KOR_limited_rearmament:0 "제한적 재무장"
 KOR_limited_rearmament_desc:0 "병기 생산이 재개되었다. 아직 규모도 인력도 부족하지만, 적어도 군대라고 부를 수 있는 것이 생겼다."
 KOR_trickcal_consumer_economy:0 "소비재 경제"
 KOR_trickcal_consumer_economy_desc:0 "지구 자체 생산이 필요 소비재를 상당 부분 대신하고 있다."
 KOR_ba_automation_idea:0 "학원 자동화"
 KOR_ba_automation_idea_desc:0 "자동 생산 라인 덕분에 공장이 숙련도를 빠르게 회복한다."
 KOR_trickcal_welfare_idea:0 "트릭컬 복지 계획"
 KOR_trickcal_welfare_idea_desc:0 "정착 지원이 자리를 잡으면서 인구가 빠르게 늘고 있다."
 KOR_ba_academy_idea:0 "학원 연구망"
 KOR_ba_academy_idea_desc:0 "키보토스의 학원들이 국가 연구 계획에 참여한다."
 KOR_open_districts:0 "열린 지구"
 KOR_open_districts_desc:0 "각 지구가 자치권을 유지한 채 연방에 참여한다."
 KOR_sealed_districts:0 "닫힌 지구"
 KOR_sealed_districts_desc:0 "지구 자치는 정지되었고 모든 결정은 중앙에서 내려온다."

 # --- 어드바이저 / 지도자 ---
 KOR_rift_commissar:0 "균열 판무관"
 KOR_district_liaison:0 "지구 연락관"
 KOR_rift_industrialist:0 "균열 산업가"
 KOR_leader_democratic:0 "삼지구 연방 대통령"
 KOR_leader_authoritarian:0 "균열 통제위원장"
